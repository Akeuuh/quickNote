[package]
name = "quicknote"
version = "0.1.0"
description = "Une note unique et permanente, affichée par un raccourci global"
authors = ["Axel Leclercq"]
edition = "2021"

[lib]
name = "quicknote_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
objc2 = "0.6.4"
objc2-app-kit = "0.3.2"
tauri = { version = "2", features = ["image-png", "macos-private-api", "tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-global-shortcut = "2.3.2"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
